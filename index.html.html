<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إيجاد المنتجات - سوبرماركت قطر</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>نظام إيجاد المنتجات 🛒</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="ابحث بالاسم أو الباركود...">
    <button onclick="fakeScan()">📷 مسح باركود</button>
    <button onclick="openAdmin()">🔐 لوحة الإدارة</button>
  </div>

  <div class="products" id="productGrid"></div>

  <div id="adminPanel" style="display:none;">
    <h2>لوحة الإدارة</h2>
    <input type="text" id="prodName" placeholder="اسم المنتج">
    <input type="text" id="prodCode" placeholder="الباركود">
    <input type="text" id="prodCat" placeholder="القسم">
    <input type="text" id="prodAisle" placeholder="الممر">
    <input type="text" id="prodFloor" placeholder="الطابق">
    <button onclick="addProduct()">إضافة منتج</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
